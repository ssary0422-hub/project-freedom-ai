<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 홍보물 텍스트 검수기 | Project Freedom AI</title><meta name="description" content="AI가 만든 한국어 홍보 문구를 공개 전에 점검하는 무료 도구입니다."><style>:root{--ink:#18161d;--muted:#6d6875;--line:#ddd8e2;--soft:#f7f4f8;--paper:#fff;--warn:#9a5b00;--bad:#a52d2d}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif}main{max-width:860px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0 20px}.brand{font-weight:800}.muted{color:var(--muted)}h1{font-size:clamp(34px,7vw,62px);line-height:1.08;letter-spacing:-.07em;margin:50px 0 14px}.lead{font-size:18px;color:var(--muted);max-width:680px}.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:24px}label{display:block;font-weight:750;margin:14px 0 6px}textarea{width:100%;min-height:220px;border:1px solid #bcb5c7;border-radius:9px;padding:12px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a{border:1px solid var(--ink);border-radius:9px;padding:10px 14px;background:#fff;color:var(--ink);font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.primary{background:var(--ink);color:#fff}.result{display:none}.result.show{display:block}.item{border-left:4px solid var(--warn);padding:10px 12px;background:#fffaf0;margin:9px 0}.item.bad{border-color:var(--bad);background:#fff5f5}.ok{border-left:4px solid #28754a;padding:10px 12px;background:#f2fbf5}.notice{margin-top:16px;padding:12px;background:#f0ecff;color:#493c83;border-radius:10px;font-size:14px}footer{margin-top:28px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px}</style></head><body><main><header><div class="brand">PROJECT FREEDOM AI</div><span class="muted">AI REVIEW</span></header><h1>AI가 만든 문구,<br>공개 전에 확인하세요</h1><p class="lead">홍보 문구를 붙여 넣으면 사람이 다시 확인해야 할 위험 신호를 먼저 찾습니다. 자동 판정이 아니라 공개 전 점검을 위한 보조 도구입니다.</p><section class="box"><label for="source">반드시 맞아야 하는 원본 정보(선택)</label><textarea id="source" style="min-height:90px" placeholder="예: 행사 기간 9/20~9/30, 가격 25,000원, 문의 010-0000-0000"></textarea><label for="copy">검수할 AI 홍보 문구</label><textarea id="copy" placeholder="AI가 만든 홍보 문구를 붙여 넣으세요."></textarea><div class="actions"><button id="check" class="primary">검수 시작</button><button id="clear">초기화</button></div></section><section id="result" class="box result" aria-live="polite"><h2>1차 검수 결과</h2><div id="summary"></div><div id="findings"></div><div class="notice">이 결과는 자동 보조 검사입니다. 가격·기간·효과·법률·의료 표현은 원본 자료와 사람이 최종 확인해야 합니다.</div><div class="actions"><button id="download" class="primary">리포트 TXT 내려받기</button><a href="/services#pilot-form">사람 검수 상담하기 ↗</a></div></section><footer>입력 내용은 이 브라우저 안에서만 처리합니다. 비밀번호·결제정보·민감한 개인정보를 입력하지 마세요.</footer></main><script>
const risky=[['효과·성과 보장 표현',/(100%|무조건|완벽|최고| guaranteed|보장|즉시 효과|부작용 없음)/i],['과장·긴급성 표현',/(최초|유일|한정|마감 임박|지금만|무료 체험 후 자동 결제)/i],['민감한 표현',/(치료|진단|처방|질병|의학적|투자 수익|원금 보장)/i]];let last=null;function run(){const source=document.querySelector('#source').value.trim(),copy=document.querySelector('#copy').value.trim(),box=document.querySelector('#findings'),summary=document.querySelector('#summary');if(!copy){summary.innerHTML='<p>검수할 문구를 입력하세요.</p>';box.innerHTML='';document.querySelector('#result').classList.add('show');return}const found=[];risky.forEach(([label,re])=>{const m=copy.match(re);if(m)found.push({label,text:m[0],bad:label==='민감한 표현'})});if(source){const nums=[...copy.matchAll(/[0-9][0-9,]*(?:원|%|일|명|시|분)?/g)].map(x=>x[0]);const sourceNums=[...source.matchAll(/[0-9][0-9,]*(?:원|%|일|명|시|분)?/g)].map(x=>x[0]);nums.filter(n=>!sourceNums.includes(n)).forEach(n=>found.push({label:'원본에 없는 숫자·조건',text:n,bad:true}))}last={source,copy,found};summary.innerHTML=`<p><strong>${copy.length}자</strong>를 검사했습니다.</p><p>${found.length?'확인 필요 항목 '+found.length+'개':'눈에 띄는 위험 신호 없음'}</p>`;box.innerHTML=found.length?found.map(x=>`<div class="item ${x.bad?'bad':''}"><strong>${x.label}</strong><br>“${x.text}” — 원본 자료와 근거를 다시 확인하세요.</div>`).join(''):'<div class="ok">자동 규칙에서 위험 신호를 찾지 못했습니다. 사실 확인은 별도로 필요합니다.</div>';document.querySelector('#result').classList.add('show')}document.querySelector('#check').onclick=run;document.querySelector('#clear').onclick=()=>{document.querySelector('#source').value='';document.querySelector('#copy').value='';document.querySelector('#result').classList.remove('show')};document.querySelector('#download').onclick=()=>{if(!last)run();const text=['AI 홍보물 텍스트 1차 검수 리포트','',`검수 문구: ${last.copy}`,'',`확인 필요: ${last.found.length}개`,...last.found.map(x=>`- ${x.label}: ${x.text}`),'','주의: 사람의 최종 사실·법률·의료·권리 확인이 필요합니다.'].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='ai-review-report.txt';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
