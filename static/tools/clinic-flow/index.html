<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>진료 순서 안내 | Project Freedom AI</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17202a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 16px 52px}.hero,.panel{background:#fff;border:1px solid #e1e5ee;border-radius:20px;box-shadow:0 10px 28px #18233a0b}.hero{padding:24px;margin-bottom:16px}.eyebrow{font-size:12px;font-weight:800;color:#5b4bd8;letter-spacing:.08em}.hero h1{font-size:clamp(28px,5vw,46px);margin:8px 0;letter-spacing:-.05em}.hero p{color:#667085;line-height:1.65;margin:0}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{padding:20px}.panel h2{font-size:18px;margin:0 0 14px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}label{font-size:13px;font-weight:750}input,select{font:inherit;padding:10px 11px;border:1px solid #d8deea;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:800;cursor:pointer;background:#5b4bd8;color:#fff}button.alt{background:#edf0ff;color:#4435b4}button.light{background:#f1f3f7;color:#334155}.btns{display:flex;gap:7px;flex-wrap:wrap}.queue{display:grid;gap:9px}.row{border:1px solid #e0e5ef;border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.row.current{border-color:#5b4bd8;background:#f4f2ff}.token{font-weight:900;font-size:21px;letter-spacing:.04em}.meta{font-size:12px;color:#667085;margin-top:3px}.status{font-size:12px;font-weight:800;color:#5b4bd8}.empty{color:#7a8495;padding:26px 4px;text-align:center}.display{background:#111827;color:#fff;border-radius:16px;padding:22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.display .label{font-size:13px;color:#b9c2d3}.display .big{font-size:clamp(42px,8vw,80px);font-weight:950;line-height:1;margin:10px 0}.display .message{font-size:18px;line-height:1.5}.field:has(#service),[data-act=serving],[data-act=done]{display:none}.waiting{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chip{background:#eef1f7;color:#334155;border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px}.notice{font-size:12px;color:#7a8495;line-height:1.55;margin:14px 0 0}.log{font-size:12px;color:#667085;line-height:1.6;margin-top:12px;max-height:130px;overflow:auto}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section class="hero"><div class="eyebrow">PATIENT FLOW MVP</div><h1>진료 순서대로 안내하세요</h1><p>대기번호를 등록하고 다음 순서의 환자를 호출합니다. 음성 안내를 켜면 호출 문구를 읽어줍니다.</p></section>
<div class="layout"><section class="panel"><h2>진료 순서 관리</h2><div class="field"><label for="token">대기번호</label><input id="token" placeholder="예: A-101" maxlength="12"></div><div class="field"><label for="service">진료 구분</label><select id="service"><option>일반 진료</option><option>초진 상담</option><option>검사 안내</option><option>수납·서류</option></select></div><div class="btns"><button id="add">대기 등록</button><button class="light" id="reset">초기화</button></div><hr><div class="btns"><button class="alt" data-act="call">다음 번호 안내</button><button class="alt" data-act="serving">진료 시작</button><button class="alt" data-act="done">완료 처리</button><button class="light" id="voice">음성 안내 켜기</button></div><p class="notice">대기번호만 사용하세요. 이름과 연락처를 입력하지 않습니다. 문자·카카오톡 발송 기능은 없습니다.</p></section>
<section class="panel"><h2>현재 안내</h2><div class="display"><div class="label" id="displayLabel">현재 안내</div><div class="big" id="current">—</div><div class="message" id="message">접수 후 대기번호를 안내받으세요.</div></div><div class="waiting" id="waiting"></div><div class="log" id="log"></div></section></div></main>
<script>
const $=id=>document.getElementById(id), key='clinic-flow-v1';let state=JSON.parse(localStorage.getItem(key)||'{"items":[],"current":null,"voice":false}');
function save(){localStorage.setItem(key,JSON.stringify(state));render()};function speak(t){if(state.voice&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function render(){const cur=state.items.find(x=>x.token===state.current);$('current').textContent=cur?cur.token:'—';$('displayLabel').textContent=cur?(cur.status==='serving'?'진료중':'호출 안내'):'현재 안내';$('message').textContent=cur?(cur.status==='serving'?`${cur.service} 진료를 진행하고 있습니다.`:`${cur.token} 고객님, ${cur.service} 진료실로 들어와 주세요.`):state.items.length?`현재 ${state.items.filter(x=>x.status==='waiting').length}명이 대기 중입니다.`:'접수 후 대기번호를 안내받으세요.';const wait=state.items.filter(x=>x.status==='waiting');$('waiting').innerHTML=wait.length?wait.map(x=>`<span class="chip">${x.token}</span>`).join(''):'<span class="empty">대기 중인 번호가 없습니다.</span>';$('log').innerHTML=state.items.slice(-8).reverse().map(x=>`<div>${x.token} · ${x.service} · ${x.status==='waiting'?'대기':x.status==='called'?'호출':x.status==='serving'?'진료중':'완료'}</div>`).join('');}
function act(kind){let item=state.items.find(x=>x.token===state.current);if(kind==='call'){item=state.items.find(x=>x.status==='waiting');if(!item){render();return}item.status='called';state.current=item.token;speak(`${item.token} 고객님, ${item.service} 진료실로 와 주세요.`)}else if(item){if(kind==='serving'){item.status='serving';speak(`${item.token} 고객님의 진료를 시작합니다.`)}if(kind==='done'){item.status='done';speak(`${item.token} 고객님의 안내가 완료되었습니다.`);state.current=null}}save()}
$('add').onclick=()=>{const token=$('token').value.trim().toUpperCase();if(!token)return;if(state.items.some(x=>x.token===token))return alert('이미 등록된 대기번호입니다.');state.items.push({token,service:$('service').value,status:'waiting',created:Date.now()});$('token').value='';save()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));$('voice').onclick=()=>{state.voice=!state.voice;$('voice').textContent=state.voice?'음성 안내 끄기':'음성 안내 켜기';save()};$('reset').onclick=()=>{if(confirm('이 브라우저의 대기 목록을 모두 지울까요?')){state={items:[],current:null,voice:false};save()}};render();
</script></body></html>
