<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공개 전 검수 체크리스트 | 순금이의 검수 작업실</title>
<meta name="description" content="홍보물, 쇼츠, 한국어 쇼핑몰을 공개하기 전 빠진 항목을 확인하는 무료 브라우저 도구입니다.">
<style>
:root{--ink:#191720;--muted:#6d6875;--line:#ded9e5;--paper:#fff;--soft:#f7f4f9;--accent:#5643a7}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif}main{max-width:900px;margin:auto;padding:24px 16px 60px}header{border-bottom:1px solid var(--line);padding:8px 0 22px;display:flex;justify-content:space-between}.brand{font-weight:800}.muted{color:var(--muted)}h1{font-size:clamp(32px,6vw,60px);line-height:1.1;letter-spacing:-.06em;margin:45px 0 14px}.intro{max-width:720px;color:var(--muted);font-size:18px}.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:24px}.modes{display:flex;gap:8px;flex-wrap:wrap}.mode{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit}.mode.active{background:var(--ink);color:#fff;border-color:var(--ink)}label{display:block;font-weight:700;margin:16px 0 6px}input[type=text],textarea{width:100%;border:1px solid #bcb5c7;border-radius:8px;padding:10px;font:inherit}textarea{min-height:75px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.check{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff}.check input{margin-top:5px;accent-color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.button{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:9px;padding:11px 15px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--ink);color:#fff}.result{display:none}.result.show{display:block}.score{font-size:32px;font-weight:850;color:#236b45}.notice{background:#f4efff;border-radius:10px;padding:12px;color:#493c83;font-size:14px;margin-top:14px}footer{margin-top:30px;padding-top:17px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}@media(max-width:650px){.checks{grid-template-columns:1fr}main{padding-top:16px}h1{margin-top:34px}}
</style></head>
<body><main><header><div class="brand">순금이의 검수 작업실</div><span class="muted">무료 · 브라우저에서만 처리</span></header>
<h1>공개하기 전에<br>빠진 항목을 확인하세요</h1>
<p class="intro">홍보물·쇼츠·한국어 쇼핑몰 중 하나를 고르면 공개 전 확인 항목을 보여드립니다. 입력 내용과 결과는 서버로 전송하지 않습니다.</p>
<section class="box"><label>검수 대상</label><div class="modes" role="tablist"><button class="mode active" data-mode="promo">AI 홍보물</button><button class="mode" data-mode="shorts">쇼츠 납품</button><button class="mode" data-mode="web">한국어 쇼핑몰</button></div>
<label for="name">프로젝트 이름(선택)</label><input id="name" type="text" placeholder="예: 9월 행사 홍보물">
<label for="facts">반드시 맞아야 하는 정보(선택)</label><textarea id="facts" placeholder="예: 행사 기간, 가격, 문의 방법"></textarea><div id="checks" class="checks"></div>
<div class="actions"><button id="reset" class="button">체크 초기화</button><button id="report" class="button primary">검수 리포트 만들기</button></div></section>
<section id="result" class="box result" aria-live="polite"><h2>검수 리포트</h2><div id="summary"></div><div class="notice">이 체크리스트는 최종 법률·의료·저작권 판단이나 매출 보장을 대신하지 않습니다. 실제 원본과 사실 자료를 대조하는 유료 검수는 별도 범위로 진행합니다.</div><div class="actions"><button id="download" class="button primary">리포트 TXT 내려받기</button><a class="button" href="/services?tool=prepublish-qc#pilot-form">사람 검수 상담하기 ↗</a></div></section>
<footer>비밀번호와 결제정보를 입력하지 마세요. 고객 동의 없이 원본을 외부 AI 서비스에 업로드하지 않습니다.</footer></main>
<script>
const sets={promo:['사업자명·상품명이 자료와 일치한다','가격·기간·문의 방법이 사실과 일치한다','이미지와 본문 문구가 서로 일치한다','사용한 이미지·폰트의 권리를 확인했다','모바일에서 핵심 문구가 잘리지 않는다','확인하지 않은 수치·효과를 쓰지 않았다','AI 사용 또는 합성 요소를 필요한 범위에서 확인했다'],shorts:['영상 비율·해상도가 납품 기준과 맞다','SRT 시간 구간이 겹치지 않는다','자막 한 줄 길이와 줄 수가 읽기 쉽다','자막이 안전 영역 안에 있다','화면과 자막의 사실 정보가 일치한다','자막과 발화·화면 내용이 어긋나지 않는다','검수 후 영상·음원·마지막 프레임을 확인했다'],web:['390px에서 가로 스크롤이 생기지 않는다','상품명·옵션·가격이 첫 화면에서 이해된다','옵션 선택 뒤 가격·재고 정보가 갱신된다','한국어 설명·버튼·오류 안내가 모순되지 않는다','장바구니의 상품·옵션·수량·금액이 일치한다','배송비 안내와 결제 직전 총액이 명확하다','실제 결제·카드·개인정보를 입력하지 않았다']};let current='promo',checks=document.querySelector('#checks');function render(){checks.innerHTML=sets[current].map((x,i)=>`<label class="check"><input type="checkbox" data-i="${i}"><span>${x}</span></label>`).join('');document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===current));document.querySelector('#result').classList.remove('show')}render();document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.mode;render()}));document.querySelector('#reset').addEventListener('click',()=>{checks.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelector('#result').classList.remove('show')});function make(){const title=document.querySelector('#name').value.trim()||'이름 없는 프로젝트',items=[...checks.querySelectorAll('input')],done=items.filter(x=>x.checked).length,total=items.length,missing=[...checks.querySelectorAll('.check')].filter((_,i)=>!items[i].checked).map(x=>x.innerText.trim());document.querySelector('#summary').innerHTML=`<p><strong>${title}</strong> · ${new Date().toLocaleString('ko-KR')}</p><p class="score">${done}/${total} 확인 완료</p><p>${missing.length?'<strong>추가 확인 필요</strong><br>'+missing.map(x=>'· '+x).join('<br>'):'모든 체크 항목을 확인했습니다.'}</p>`;document.querySelector('#result').classList.add('show');return{title,done,total,missing,facts:document.querySelector('#facts').value.trim()}}document.querySelector('#report').addEventListener('click',make);document.querySelector('#download').addEventListener('click',()=>{const r=make(),text=['공개 전 검수 리포트',`프로젝트: ${r.title}`,`확인: ${r.done}/${r.total}`,`반드시 맞아야 하는 정보: ${r.facts||'(입력 없음)'}`,'','추가 확인 필요:',...(r.missing.length?r.missing.map(x=>'- '+x):['없음']),'','주의: 최종 법률·의료·저작권 판단이나 매출 보장을 대신하지 않습니다.'].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='prepublish-qc-report.txt';a.click();URL.revokeObjectURL(a.href)});
</script></body></html>
