    <section class="sungeum-briefing"><label>오늘의 순금 브리핑</label><h3>오늘 홍보, 제가 먼저 준비할게요.</h3><p>행사나 남은 재고만 알려주면 문구·이미지·검수까지 한 번에 진행해요.</p><button data-sungeum-action="campaign">이번 주 홍보 맡기기 <b>→</b></button></section>
