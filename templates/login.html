{% extends "base.html" %}

{% block title %}로그인 - Project Freedom AI{% endblock %}

{% block content %}
<div class="container py-3" style="max-width: 560px;">
    <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">🔐 로그인</h2>
                <p class="text-muted mb-0">
                    내 브랜드와 콘텐츠를 관리하세요.
                </p>
            </div>

            {% if registered %}
            <div class="alert alert-success">
                🎉 회원가입이 완료되었습니다. 로그인해 주세요.
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control form-control-lg"
                        value="{{ email }}"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">비밀번호</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="비밀번호"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="d-grid">
                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">
                        로그인
                    </button>
                </div>

            </form>

            <div class="text-center mt-4">
                <span class="text-muted">처음이신가요?</span>
                <a href="/register" class="text-decoration-none fw-semibold">
                    무료 회원가입
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
