{% extends "base.html" %}

{% block title %}회원가입 - Project Freedom AI{% endblock %}

{% block content %}
<div class="container py-3" style="max-width: 560px;">
    <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">🚀 회원가입</h2>
                <p class="text-muted mb-0">
                    Project Freedom AI 계정을 만들어보세요.
                </p>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">이름</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control form-control-lg"
                        value="{{ username }}"
                        placeholder="예) 성현"
                        autocomplete="name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control form-control-lg"
                        value="{{ email }}"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="8자 이상"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">비밀번호 확인</label>
                    <input
                        type="password"
                        name="password_confirm"
                        class="form-control form-control-lg"
                        placeholder="비밀번호를 다시 입력"
                        autocomplete="new-password"
                        required>
                </div>

                <div class="d-grid">
                    <button
                        type="submit"
                        class="btn btn-primary btn-lg">
                        ✨ 계정 만들기
                    </button>
                </div>

            </form>

            <div class="text-center mt-4">
                <span class="text-muted">이미 계정이 있나요?</span>
                <a href="/login" class="text-decoration-none fw-semibold">
                    로그인
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
