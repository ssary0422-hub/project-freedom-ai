<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Project Freedom AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">

        <a class="navbar-brand" href="/">
            🤖 Project Freedom AI
        </a>

        <div>
            <a class="btn btn-outline-light me-2" href="/">
                홈
            </a>

            <a class="btn btn-outline-light" href="/history">
                생성 기록
            </a>
        </div>

    </div>
</nav>

<div class="container pb-5">

    <div class="text-center mb-4">
        <h1>🤖 Project Freedom AI</h1>

        <p class="text-muted">
            AI가 당신의 콘텐츠 제작을 도와드립니다.
        </p>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <div class="btn-group w-100 mb-4">

                <a href="/" class="btn btn-primary">
                    📢 광고
                </a>
            
                <a href="/blog" class="btn btn-outline-primary">
                    📝 블로그
                </a>
            
                <a href="/sns" class="btn btn-outline-primary">
                    📱 SNS
                </a>
            
            </div>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">업종</label>

                    <input
                        type="text"
                        class="form-control"
                        name="business"
                        value="{{ business }}"
                        placeholder="예) 마사지샵"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">회사명</label>

                    <input
                        type="text"
                        class="form-control"
                        name="company"
                        value="{{ company }}"
                        placeholder="예) 7데이즈"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">원하는 분위기</label>

                    <input
                        type="text"
                        class="form-control"
                        name="style"
                        value="{{ style }}"
                        placeholder="예) 고급스럽고 친절한"
                        required>
                </div>

                <div class="d-grid">
                    <button
                        class="btn btn-primary btn-lg"
                        type="submit">
                        🚀 광고 만들기
                    </button>
                </div>

            </form>

        </div>
    </div>

    {% if result %}

    <div class="card shadow mt-4">

        <div class="card-header">
            🤖 AI 결과
        </div>

        <div class="card-body">

            <pre
                id="result"
                class="bg-light p-3 rounded"
                style="min-height: 250px; white-space: pre-wrap;">{{ result }}</pre>

            <a
                href="/download"
                class="btn btn-success me-2">
                📄 Word 다운로드
            <a
                href="/download/pdf"
                class="btn btn-danger me-2">

                📕 PDF 다운로드
            </a>

            <button
                type="button"
                class="btn btn-primary"
                onclick="copyResult()">
                📋 복사하기
            </button>

        </div>
    </div>

    {% endif %}

</div>

<script>
    async function copyResult() {
        const resultElement = document.getElementById("result");

        if (!resultElement) {
            alert("복사할 결과가 없습니다.");
            return;
        }

        try {
            await navigator.clipboard.writeText(
                resultElement.innerText
            );

            alert("📋 복사되었습니다!");
        } catch (error) {
            alert("복사에 실패했습니다.");
            console.error(error);
        }
    }
</script>

</body>
</html>
