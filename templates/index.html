<!DOCTYPE html>
<html lang="ko">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">

    <div class="container">

        <a class="navbar-brand" href="/">
            🤖 Project Freedom AI
        </a>

        <div>

            <a class="btn btn-outline-light me-2" href="/">
                홈
            </a>

            <a class="btn btn-outline-light" href="/history">
                생성기록
            </a>

        </div>

    </div>
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Project Freedom AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
    
        <h1 class="text-center mb-3">
            🤖 Project Freedom AI
        </h1>
    
        <p class="text-center text-muted">
            AI가 당신의 콘텐츠 제작을 도와드립니다.
        </p>
    
    </div>
    

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="text-center mb-4">
                🤖 Project Freedom AI
            </h1>

            <form method="POST">

                <div class="btn-group w-100 mb-4">

                    <button class="btn btn-primary">
                        📢 광고
                    </button>
                
                    <button class="btn btn-outline-primary">
                        📝 블로그
                    </button>
                
                    <button class="btn btn-outline-primary">
                        📱 SNS
                    </button>
                
                </div>

                <div class="mb-3">
                    <label class="form-label">업종</label>
                    <input
                        type="text"
                        class="form-control"
                        name="business"
                        value="{{ business }}"
                        placeholder="예) 마사지샵">
                </div>

                <div class="mb-3">
                    <label class="form-label">회사명</label>
                    <input
                        type="text"
                        class="form-control"
                        name="company"
                        value="{{ company }}"
                        placeholder="예) 7데이즈">
                </div>

                <div class="mb-3">
                    <label class="form-label">원하는 분위기</label>
                    <input
                        type="text"
                        class="form-control"
                        name="style"
                        value="{{ style }}"
                        placeholder="예) 고급스럽고 친절한">
                </div>

                <div class="d-grid">
                    <button
                        class="btn btn-primary btn-lg w-100"
                        type="submit">

                        🚀 광고 만들기

                    </button>

                </div>

            </form>

        </div>

    </div>

    <div class="card shadow mt-4">

            <div class="card-header">
                🤖 AI 결과
            </div>
        
            <div class="card-body">
        
                <pre  
                    id="result"
                    class="bg-light p-3 rounded"
                    style="min-height:250px;">{{ result }}</pre>
        

                <a
                href="/download"
                class="btn btn-success">
            
                📄 Word 다운로드
            
            </a>


            <button
                class="btn btn-success mb-3"
                onclick="copyResult()">
                
                📋 복사하기
                
            </button>

        </div>

    </div>

</div>

<script>

    function copyResult() {
    
        const text = document.getElementById("result").innerText;
    
        navigator.clipboard.writeText(text);
    
        alert("📋 복사되었습니다!");
    
    }
    
    </script>

</body>

</html>
