{% for item in history_list %}

<hr>

<p><b>업종 :</b> {{ item[1] }}</p>
<p><b>회사명 :</b> {{ item[2] }}</p>
<p><b>분위기 :</b> {{ item[3] }}</p>

<pre>{{ item[4] }}</pre>

{% if item[5] %}
    <img
        src="{{ item[5] }}"
        class="img-fluid rounded shadow"
        style="max-width: 500px;"
        alt="생성 이미지">
{% endif %}

<br><br>

<a
    href="/delete/{{ item[0] }}"
    class="btn btn-danger btn-sm">
    🗑 삭제
</a>

{% endfor %}

</body>
</html>
